<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#041A34;
    --paper:#FBF5EB;
    --card:#FFFFFF;
    --line:rgba(4,26,52,0.13);
    --line-soft:rgba(4,26,52,0.07);
    --amber:#B47B33;
    --amber-deep:#8C6028;
    --amber-bg:#F2E7DA;
    --red:#83524F;
    --red-bg:#F9E8E7;
    --green:#545F55;
    --green-bg:#E4E7E4;
    --gold:#7E5624;
    --blush-raw:#E18D89;
    --sage-raw:#788879;
    --gold-raw:#B47B33;
    --champagne-raw:#E0CAB0;
    --gold-bg:#EBDDCC;
    --muted:#6C7681;
    --muted-2:#93999E;
    --pop-gradient:linear-gradient(135deg, var(--blush-raw) 0%, var(--gold-raw) 100%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 6% 6%, color-mix(in srgb, var(--blush-raw) 11%, transparent) 0%, transparent 38%),
      radial-gradient(circle at 96% 18%, color-mix(in srgb, var(--gold-raw) 11%, transparent) 0%, transparent 38%),
      radial-gradient(circle at 50% 100%, color-mix(in srgb, var(--champagne-raw) 16%, transparent) 0%, transparent 45%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;}
  #app{max-width:900px;margin:0 auto;padding-bottom:64px;}

  /* ---- Header ---- */
  header.top{
    padding:20px 16px 14px;
    border-bottom:1px solid color-mix(in srgb, var(--gold-raw) 22%, var(--line));
    background:linear-gradient(180deg, color-mix(in srgb, var(--blush-raw) 9%, var(--paper) 91%), var(--paper));
    position:sticky;top:0;z-index:20;
  }
  header.top .title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  header.top h1{
    font-size:22px;font-weight:800;margin:0;letter-spacing:-0.01em;
    background:var(--pop-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header.top .save-status{font-size:11.5px;color:var(--muted-2);white-space:nowrap;}
  header.top p.sub{margin:3px 0 0;color:var(--muted);font-size:13px;}

  nav.tabs{
    display:flex;gap:8px;overflow-x:auto;padding:12px 16px 10px;
    border-bottom:1px solid color-mix(in srgb, var(--gold-raw) 18%, var(--line));background:transparent;
    position:sticky;top:64px;z-index:19;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size:13.5px;font-weight:600;
    padding:8px 15px;border:none;background:color-mix(in srgb, var(--champagne-raw) 22%, white 78%);
    color:var(--muted);cursor:pointer;
    border-radius:20px;
  }
  nav.tabs button.active{
    color:#fff;background:var(--pop-gradient);
    box-shadow:0 3px 10px color-mix(in srgb, var(--gold-raw) 40%, transparent);
  }

  #content{padding:16px;}

  /* ---- Generic ---- */
  .card{background:var(--card);border:1px solid color-mix(in srgb, var(--champagne-raw) 55%, var(--line) 45%);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(4,26,52,0.05);}
  .section-title{font-size:13px;font-weight:700;text-transform:none;color:var(--ink);margin:22px 0 10px;padding-left:10px;border-left:3px solid;border-image:var(--pop-gradient) 1;}
  .section-title:first-child{margin-top:0;}
  .btn{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-size:13.5px;font-weight:600;
    padding:9px 14px;border-radius:12px;border:1px solid color-mix(in srgb, var(--champagne-raw) 50%, var(--line) 50%);
    background:var(--card);color:var(--ink);cursor:pointer;
  }
  .btn.primary{
    background:var(--pop-gradient);color:#fff;border:none;
    box-shadow:0 4px 14px color-mix(in srgb, var(--gold-raw) 35%, transparent);
  }
  .btn.amber{background:var(--amber);color:#fff;border-color:var(--amber);}
  .btn.danger{color:var(--red);border-color:var(--red);background:var(--red-bg);}
  .btn.ghost{background:color-mix(in srgb, var(--blush-raw) 7%, transparent);border-color:transparent;color:var(--muted);}
  .btn.small{padding:6px 10px;font-size:12.5px;border-radius:20px;}
  .btn:active{transform:translateY(1px);}
  input,select,textarea{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-size:14px;color:var(--ink);
    padding:9px 10px;border:1px solid color-mix(in srgb, var(--champagne-raw) 45%, var(--line) 55%);border-radius:10px;
    background:#fff;width:100%;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--amber);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--gold-raw) 16%, transparent);
  }
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px;}
  .field{margin-bottom:12px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ---- Stat cards ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat{background:var(--card);border:1px solid color-mix(in srgb, var(--champagne-raw) 55%, var(--line) 45%);border-radius:16px;padding:13px 14px;box-shadow:0 2px 10px rgba(4,26,52,0.05);}
  .stat .num{
    font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;font-size:27px;font-weight:700;line-height:1;
    background:var(--pop-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:5px;}
  .stat.flag-red .num{background:none;-webkit-text-fill-color:initial;color:var(--red);}
  .stat.flag-amber .num{background:none;-webkit-text-fill-color:initial;color:var(--amber-deep);}

  /* ---- Badges ---- */
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .badge.Healthy{background:var(--green-bg);color:var(--green);}
  .badge.Renewal-Upcoming{background:var(--amber-bg);color:var(--amber-deep);}
  .badge.At-Risk{background:var(--red-bg);color:var(--red);}
  .badge.Opportunity{background:var(--gold-bg);color:var(--gold);}
  .badge.priority-High{background:#F9E8E7;color:#83524F;}
  .badge.priority-Medium{background:#F2E7DA;color:#8C6028;}
  .badge.priority-Low{background:#E4E7E4;color:#6C7681;}
  .badge.vendor-CDK{background:var(--green-bg);color:var(--green);}
  .badge.vendor-Competitor{background:var(--red-bg);color:var(--red);}

  /* ---- Overview list rows ---- */
  .flist{display:flex;flex-direction:column;gap:8px;}
  .frow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card);border:1px solid color-mix(in srgb, var(--champagne-raw) 50%, var(--line) 50%);border-radius:14px;padding:10px 12px;
    cursor:pointer;box-shadow:0 1px 6px rgba(4,26,52,0.04);
  }
  .frow .fmain{min-width:0;}
  .frow .fname{font-weight:600;font-size:14px;}
  .frow .fmeta{font-size:12px;color:var(--muted);margin-top:2px;}
  .frow .fright{text-align:right;flex:0 0 auto;}
  .frow .fdays{font-size:12px;font-weight:600;color:var(--amber-deep);white-space:nowrap;}
  .empty{color:var(--muted-2);font-size:13px;padding:14px 2px;}

  /* ---- Accounts tab ---- */
  .filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{
    font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:20px;
    border:1px solid color-mix(in srgb, var(--champagne-raw) 50%, var(--line) 50%);background:var(--card);color:var(--muted);cursor:pointer;
  }
  .chip.on{background:var(--pop-gradient);color:#fff;border-color:transparent;box-shadow:0 2px 8px color-mix(in srgb, var(--gold-raw) 30%, transparent);}
  .acct-card{
    background:var(--card);border:1px solid color-mix(in srgb, var(--champagne-raw) 50%, var(--line) 50%);border-radius:16px;
    padding:12px 13px;margin-bottom:9px;box-shadow:0 2px 10px rgba(4,26,52,0.05);
  }
  .acct-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .acct-name{font-weight:600;font-size:14.5px;}
  .acct-loc{font-size:12px;color:var(--muted);margin-top:1px;}
  .acct-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
  .acct-details{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;}
  .acct-actions{display:flex;gap:6px;margin-top:10px;}
  .tip-box{background:var(--amber-bg);border-radius:14px;padding:9px 11px;margin-top:9px;font-size:12.5px;color:#8C6028;}

  /* ---- Territory tab ---- */
  .state-group{margin-bottom:18px;}
  .state-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .state-head h3{font-size:15px;margin:0;}
  .state-head span{font-size:12px;color:var(--muted-2);}
  .visit-row{
    background:var(--card);border:1px solid color-mix(in srgb, var(--champagne-raw) 50%, var(--line) 50%);border-radius:14px;

  .visit-row .vtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .visit-row .vname{font-weight:600;font-size:14px;}
  .visit-row .vmeta{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .visit-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;}
  .visit-dates .field{margin-bottom:0;}
  .unscheduled{color:var(--amber-deep);font-weight:600;font-size:11px;}

  /* ---- Tasks tab ---- */
  .task-group{margin-bottom:16px;}
  .task-row{
    display:flex;align-items:flex-start;gap:10px;
    background:var(--card);border:1px solid color-mix(in srgb, var(--champagne-raw) 50%, var(--line) 50%);border-radius:14px;
    padding:10px 12px;margin-bottom:7px;box-shadow:0 1px 6px rgba(4,26,52,0.04);
  }
  .task-row.done{opacity:0.5;}
  .task-row input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;margin-top:1px;accent-color:var(--amber);}
  .task-main{flex:1;min-width:0;}
  .task-title{font-size:14px;font-weight:500;}
  .task-row.done .task-title{text-decoration:line-through;}
  .task-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .task-meta.overdue{color:var(--red);font-weight:600;}

  /* ---- Modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(4,26,52,0.42);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal{
    background:var(--paper);width:100%;max-width:900px;max-height:88vh;overflow-y:auto;
    border-radius:22px 22px 0 0;padding:18px 16px 26px;
    border-top:5px solid var(--gold-raw);
  }
  @media(min-width:640px){
    .overlay{align-items:center;}
    .modal{border-radius:20px;max-height:80vh;}
  }
  .modal h2{font-size:17px;margin:0 0 14px;}
  .modal-close{position:sticky;top:0;text-align:right;margin-bottom:-6px;}

  .fab-add{
    width:100%;margin-top:4px;
  }
  .fab-capture{
    position:fixed;bottom:22px;right:20px;width:58px;height:58px;border-radius:50%;

    box-shadow:0 6px 18px color-mix(in srgb, var(--blush-raw) 45%, transparent);cursor:pointer;z-index:40;
    display:flex;align-items:center;justify-content:center;padding-bottom:3px;
    animation:fabPulse 2.6s ease-in-out infinite;
  }
  @keyframes fabPulse{
    0%,100%{box-shadow:0 6px 18px color-mix(in srgb, var(--blush-raw) 45%, transparent);}
    50%{box-shadow:0 6px 22px color-mix(in srgb, var(--gold-raw) 60%, transparent);}
  }
  .fab-capture:active{transform:scale(0.94);}
  .auth-card input{
    border-radius:12px;background:color-mix(in srgb, var(--champagne-raw) 10%, white 90%);

  }
  .auth-card input:focus{
    outline:none;border-color:var(--amber);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--gold-raw) 18%, transparent);
  }
  .auth-cute-btn{
    background:linear-gradient(135deg, var(--amber), var(--gold-raw));
    border:none;font-size:15px;padding:12px;border-radius:14px;
    box-shadow:0 6px 16px color-mix(in srgb, var(--gold-raw) 45%, transparent);
    transition:transform 0.12s ease;
  }
  .auth-cute-btn:active{transform:scale(0.97);}
  a.linklike{color:var(--amber-deep);font-weight:600;cursor:pointer;}

function uid(){ return Math.random().toString(36).slice(2,10); }
function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(base,n){ const d=new Date(base); d.setDate(d.getDate()+n); return d; }
function today(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function parseLocal(str){ return str ? new Date(str+'T00:00:00') : null; }
function daysUntil(str){ if(!str) return null; const diff = parseLocal(str) - today(); return Math.round(diff/86400000); }
function niceDate(str){
  if(!str) return '—';
  const d = parseLocal(str);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year: d.getFullYear()!==new Date().getFullYear() ? 'numeric' : undefined });
}
function daysLabel(str){
  const n = daysUntil(str);
  if(n===null) return '';
  if(n===0) return 'Today';
  if(n===1) return 'Tomorrow';
  if(n===-1) return '1 day overdue';
  if(n<0) return `${Math.abs(n)} days overdue`;
  return `in ${n} days`;
}
function slug(s){ return s.replace(/\s+/g,'-'); }
function monthsLabel(str){
  const d = daysUntil(str);
  if(d===null) return '';
  if(d<0) return daysLabel(str);
  if(d<60) return daysLabel(str);
  const months = Math.round(d/30.44);
  return `~${months} month${months===1?'':'s'} left`;
}
function lastVisitDate(a){
  const log = a.visitLog||[];
  if(!log.length) return null;
  return [...log].sort((x,y)=>y.date.localeCompare(x.date))[0].date;
}
function lastActivity(a){
  const log = a.visitLog||[];
  if(!log.length) return null;
  return [...log].sort((x,y)=>y.date.localeCompare(x.date))[0];
}
const STALE_DAYS = 90;
function isStale(a){
  const last = lastVisitDate(a);
  if(!last) return true;
  return daysUntil(last) <= -STALE_DAYS;
}
function mapsAddress(a){ return a.address ? a.address : `${a.city}, ${a.state}`; }
function mapsSingleUrl(a){ return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(mapsAddress(a))}`; }
function mapsRouteUrl(accounts){
  const home = state.data.settings && state.data.settings.homeBase;
  const stops = accounts.map(a=>mapsAddress(a));
  const full = home ? [home, ...stops, home] : stops;
  return `https://www.google.com/maps/dir/${full.map(encodeURIComponent).join('/')}`;
}
function nightStatus(dateStr){
  const sched = state.data.boyfriendSchedule || { workDays:[], overrides:[] };
  const override = sched.overrides.find(o=>o.date===dateStr);
  if(override) return { status: override.type, note: override.note||'', override };
  const dow = WEEKDAYS[parseLocal(dateStr).getDay()];
  return { status: sched.workDays.includes(dow) ? 'work' : 'clear', note:'', override:null };
}
function nightBadge(dateStr){
  const ns = nightStatus(dateStr);
  const map = {
    work: { cls:'At-Risk', label:"He's working — no override" },
    clear: { cls:'Healthy', label:'Clear' },
    sitter: { cls:'Healthy', label:'Sitter arranged' },
    off: { cls:'Healthy', label:'Marked off' },
  };
  const m = map[ns.status] || map.clear;
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

const AUTO_EMAIL = 'courtney@rainbowsandrevenue.app';

let saveTimer = null;
let dbWriteInFlight = false;
let dbWriteQueued = false;

function setSaveStatus(text){
  const el = document.getElementById('saveStatus');
  if(el) el.textContent = text;
}

async function dbSetNow(){
  if(dbWriteInFlight){ dbWriteQueued = true; return; }
  dbWriteInFlight = true;
  setSaveStatus('Syncing…');
  try{
    const { error } = await sb.from('dashboard_data').upsert({
      user_id: currentUser.id,
      data: state.data,
      updated_at: new Date().toISOString(),
    });
    if(error) throw error;
    setSaveStatus('Synced');
  }catch(e){
    setSaveStatus('Sync failed — will retry next change');
    console.error('supabase save error', e);
  }
  dbWriteInFlight = false;
  if(dbWriteQueued){ dbWriteQueued = false; dbSetNow(); }
}

function persistNow(){
  state.data.updatedAt = new Date().toISOString();
  dbSetNow();
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 150);
}

async function loadFromSupabase(){
  try{
    const { data: row, error } = await sb.from('dashboard_data').select('data').eq('user_id', currentUser.id).maybeSingle();
    if(error) throw error;
    if(row && row.data && Array.isArray(row.data.accounts)){
      state.data = row.data;
      migrateDataDefaults();
    } else {
      seedData();
      await sb.from('dashboard_data').upsert({ user_id: currentUser.id, data: state.data, updated_at: new Date().toISOString() });
    }
  }catch(e){
    console.error('supabase load error', e);
    seedData();
  }
  render();
}
function migrateDataDefaults(){
  if(!state.data.settings) state.data.settings = { homeBase: '' };
  if(!state.data.boyfriendSchedule) state.data.boyfriendSchedule = { workDays: [], overrides: [] };
  if(!state.data.boyfriendSchedule.workDays) state.data.boyfriendSchedule.workDays = [];
  if(!state.data.boyfriendSchedule.overrides) state.data.boyfriendSchedule.overrides = [];
  if(!state.data.initiatives) state.data.initiatives = [];
  state.data.accounts.forEach(a=>{
    if(a.parentGroupId===undefined) a.parentGroupId=null;
    if(!a.initiativesDiscussed) a.initiativesDiscussed = [];
    (a.visitLog||[]).forEach(v=>{ if(!v.type) v.type='Visit'; });
  });
}

async function signOut(){
  await sb.auth.signOut();
  currentUser = null;
  renderAuthScreen();
}

          box-shadow:0 18px 40px rgba(4,26,52,0.16), 0 2px 8px rgba(4,26,52,0.08);
          border:1px solid color-mix(in srgb, var(--champagne-raw) 60%, white 40%);">

          <h1 style="font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;font-style:italic;font-size:15px;color:var(--muted);
            margin:0 0 24px;font-weight:400;">${heading}</h1>
          ${mode!=='reset' ? `<div class="field" style="text-align:left;">
            <label>Email</label>
            <input id="auth_email" type="email" data-autofocus />

          ${errorMsg ? `<div style="color:var(--red);font-size:12.5px;margin-bottom:10px;">${esc(errorMsg)}</div>` : ''}
          ${infoMsg ? `<div style="color:var(--sage-raw);font-size:12.5px;margin-bottom:10px;font-weight:600;">${esc(infoMsg)}</div>` : ''}

async function load(){
  const { data: { session } } = await sb.auth.getSession();
  if(recoveryMode){ renderAuthScreen('reset'); return; }
  if(session && session.user){
    currentUser = session.user;
    await loadFromSupabase();
    return;
  }
  try{

      await loadFromSupabase();

function niceDateTime(iso){
  if(!iso) return 'never';
  const d = new Date(iso);
  return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}

function downloadBackup(){
  clearTimeout(saveTimer);
  persistNow();
  const jsonStr = JSON.stringify(state.data, null, 2);
  const blob = new Blob([jsonStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'rainbows-and-revenue-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function restoreBackup(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!(parsed && Array.isArray(parsed.accounts) && Array.isArray(parsed.tasks))){
        state.ui.backupError = "That file doesn't look like a dashboard file.";
        state.ui.pendingRestore = null;
        render();
        return;
      }
      const currentTime = state.data.updatedAt ? new Date(state.data.updatedAt).getTime() : 0;
      const fileTime = parsed.updatedAt ? new Date(parsed.updatedAt).getTime() : 0;
      if(currentTime && fileTime && fileTime < currentTime){
        state.ui.pendingRestore = parsed;
        state.ui.backupError = null;
        render();
      } else {
        applyRestore(parsed);
      }
    }catch(err){
      state.ui.backupError = "Couldn't read that file.";
      render();
    }
  };
  reader.readAsText(file);
}
function applyRestore(parsed){
  state.data = parsed;
  persistNow();
  state.ui.modal = null;
  state.ui.pendingRestore = null;
  state.ui.backupError = null;
  render();
}
function cancelRestore(){ state.ui.pendingRestore = null; render(); }

function focusScore(a){
  let score = 0;
  if(a.status==='At Risk') score += 300;
  if(a.priority==='High') score += 100;
  if(a.status==='Renewal Upcoming') score += 60;
  const d = daysUntil(a.renewalDate);
  if(d!==null) score += Math.max(0, 90-d);
  return score;
}
function weeklyContactStats(){
  const inWindow = (dateStr) => dateStr!=null && daysUntil(dateStr)!==null && daysUntil(dateStr)>=-7 && daysUntil(dateStr)<=0;
  const total = state.data.accounts.length;
  const contacted = state.data.accounts.filter(a=> (a.visitLog||[]).some(v=>inWindow(v.date)) );
  return { total, contacted: contacted.length };
}
function completedLast7Days(){
  return state.data.tasks.filter(t=>t.done && t.completedAt && daysUntil(t.completedAt)!==null && daysUntil(t.completedAt)>=-7 && daysUntil(t.completedAt)<=0).length;
}
function weekInReviewData(){
  const inWindow = (dateStr) => dateStr!=null && daysUntil(dateStr)!==null && daysUntil(dateStr)>=-7 && daysUntil(dateStr)<=0;
  const activities = [];
  state.data.accounts.forEach(a=>{
    (a.visitLog||[]).forEach(v=>{ if(inWindow(v.date)) activities.push({ account:a, ...v }); });
  });
  const visits = activities.filter(x=>x.type==='Visit').length;
  const calls = activities.filter(x=>x.type==='Call').length;
  const emails = activities.filter(x=>x.type==='Email').length;
  const uniqueAccountsTouched = new Set(activities.map(x=>x.account.id)).size;

  const tasksCompleted = state.data.tasks.filter(t=>t.done && inWindow(t.completedAt));

  const talkingPoints = [];
  state.data.accounts.forEach(a=>{
    (a.initiativesDiscussed||[]).forEach(e=>{
      if(inWindow(e.date)){
        const init = state.data.initiatives.find(i=>i.id===e.initiativeId);
        talkingPoints.push({ account:a, initiative: init });
      }
    });
  });

  const marketingSent = [];
  state.data.accounts.forEach(a=>{
    (a.marketing||[]).forEach(m=>{ if(inWindow(m.date)) marketingSent.push({ account:a, ...m }); });
  });

  const atRiskAccounts = state.data.accounts.filter(a=>a.status==='At Risk');
  const atRiskContacted = atRiskAccounts.filter(a=> (a.visitLog||[]).some(v=>inWindow(v.date)) );

  return { activities, visits, calls, emails, uniqueAccountsTouched, tasksCompleted, talkingPoints, marketingSent,
    atRiskTotal: atRiskAccounts.length, atRiskContactedCount: atRiskContacted.length };
}

  lines.push(`At-risk contact rate: ${d.atRiskContactedCount}/${d.atRiskTotal}`);
  lines.push(`Tasks completed: ${d.tasksCompleted.length}`);
  d.tasksCompleted.forEach(t=>lines.push(`- ${t.title}`));

function rightNowItems(){

    items.push({ score: 1000+days, icon:'⏰', label: t.title, sub: `${days} day${days===1?'':'s'} overdue`, type:'task' });
  });
  state.data.csmRequests.filter(r=>r.status==='Open' && r.followUpDate && daysUntil(r.followUpDate)<=0).forEach(r=>{
    const acc = getAccount(r.accountId);
    const days = Math.abs(daysUntil(r.followUpDate));
    items.push({ score: 900+days, icon:'📞', label: `Follow up with ${csmName(r.csmId)}`, sub: (acc?acc.name+' · ':'')+`${days} day${days===1?'':'s'} overdue`, type:'csm' });
  });
  state.data.tasks.filter(t=>!t.done && daysUntil(t.dueDate)===0).forEach(t=>{
    items.push({ score: 800, icon:'✅', label: t.title, sub: 'Due today', type:'task' });
  });
  state.data.accounts.forEach(a=>{
    if(isStale(a)){
      const d = daysUntil(a.renewalDate);
      const urgent = a.status==='At Risk' || (d!==null && d>=0 && d<=30);
      items.push({ score: urgent?700:500, icon:'📵', label: a.name, sub: `No contact ${STALE_DAYS}+ days`+(urgent?' · needs attention':''), type:'account', id:a.id });
    }
  });
  state.data.accounts.forEach(a=>{
    const d = daysUntil(a.renewalDate);
    if(d!==null && d>=0 && d<=180 && (a.status==='Healthy' || a.status==='Opportunity')){
      items.push({ score:600, icon:'📄', label:a.name, sub:`Renews ${monthsLabel(a.renewalDate)} — past the 6-month mark, conversation not started`, type:'account', id:a.id });
    }
  });
  return items.sort((a,b)=>b.score-a.score).slice(0,5);
}

const CSV_COLUMNS = ['Name','City','State','Address','Status','Priority','Renewal Date','CSM','Notes'];
function csvEscape(val){
  const s = (val==null ? '' : String(val));
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
function accountsToCsv(){
  const rows = [CSV_COLUMNS.join(',')];
  state.data.accounts.forEach(a=>{
    rows.push([a.name, a.city, a.state, a.address||'', a.status, a.priority, a.renewalDate||'', csmName(a.csmId), a.notes||''].map(csvEscape).join(','));
  });
  return rows.join('\n');
}
function exportAccountsCsv(){
  const csv = accountsToCsv();
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'accounts.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; }
      } else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && text[i+1]==='\n') i++;
        row.push(field); field='';
        if(row.length>1 || row[0]!==''){ rows.push(row); }
        row = [];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).map(r=>{
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (r[i]||'').trim());
    return obj;
  });
}

function handleCsvFile(input){
  const file = input.files[0];

  const text = document.getElementById('csvPasteArea').value;

  const rows = parseCsv(text);
  const named = rows.filter(r=>r.name);
  if(!named.length){ state.ui.csvError = "Couldn't find a Name column with values."; state.ui.csvPreview=null; render(); return; }
  named.forEach(r=>{ r._existing = !!state.data.accounts.find(a=>a.name.toLowerCase()===r.name.toLowerCase()); });

function buildAccountSummary(a){
  const d = daysUntil(a.renewalDate);
  const lastAct = lastActivity(a);
  const lines = [];
  lines.push(`${a.name} — ${a.city}, ${a.state}`);
  lines.push(`Status: ${a.status} (${a.priority} priority) · CSM: ${csmName(a.csmId)}`);
  lines.push(`Renewal: ${a.renewalDate ? niceDate(a.renewalDate) + (d!==null?' ('+monthsLabel(a.renewalDate)+')':'') : 'Not set'}`);
  lines.push('');
  if((a.products||[]).length){
    lines.push('Products:');
    a.products.forEach(p=> lines.push(`- ${p.category}: ${p.name} (${p.vendor==='CDK'?'Ours':'Competitor'})`));
    lines.push('');
  }
  lines.push(`Last activity: ${lastAct ? niceDate(lastAct.date)+' ('+(lastAct.type||'Visit')+')'+(lastAct.notes?' — '+lastAct.notes:'') : 'None logged'}`);
  lines.push(`Next visit: ${niceDate(a.nextVisit)}`);
  if(a.notes){ lines.push(''); lines.push(`Notes: ${a.notes}`); }
  const planned = a.planning ? DEPARTMENTS.filter(dep=>a.planning[dep] && (a.planning[dep].strengths||a.planning[dep].weaknesses)) : [];
  if(planned.length){
    lines.push('');
    lines.push('Account planning:');
    planned.forEach(dep=>{
      const p = a.planning[dep];
      const parts = [];
      if(p.strengths) parts.push('Strengths: '+p.strengths);
      if(p.weaknesses) parts.push('Weaknesses: '+p.weaknesses);
      lines.push(`${dep} — ${parts.join(' | ')}`);
    });
  }
  const undiscussed = undiscussedInitiatives(a);
  if(undiscussed.length){
    lines.push('');
    lines.push('Talk about next: ' + undiscussed.map(i=>i.title).join(', '));
  }
  return lines.join('\n');
}

function tripNightDates(){

/* ================= TASKS ================= */
function tasksHTML(){
  const open = state.data.tasks.filter(t=>!t.done);
  const doneAll = state.data.tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
  const needsLog = doneAll.filter(t=>!t.loggedToSF);
  const logged = doneAll.filter(t=>t.loggedToSF);
  const overdue = open.filter(t=>daysUntil(t.dueDate)!==null && daysUntil(t.dueDate)<0).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const soon = open.filter(t=>daysUntil(t.dueDate)!==null && daysUntil(t.dueDate)>=0 && daysUntil(t.dueDate)<=7).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const later = open.filter(t=>t.dueDate==null || daysUntil(t.dueDate)>7).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));

  return `
    <button class="btn primary fab-add" onclick="openTaskModal('new')">+ Add task</button>
    ${taskGroup('Overdue', overdue)}
    ${taskGroup('Due this week', soon)}
    ${taskGroup('Later', later)}
    ${needsLog.length? `
      <div class="task-group">
        <div class="section-title">Completed — log in Salesforce (${needsLog.length})</div>
        ${needsLog.map(t=>taskRow(t)).join('')}
      </div>
    `: ''}
    ${logged.length? `
      <div class="task-group">
        <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
          <span>Logged to Salesforce (${logged.length})</span>
          <a class="linklike" style="font-size:12px;" onclick="confirmDelete('clearCompleted','all')">${state.ui.deleteConfirm && state.ui.deleteConfirm.id==='all' ? 'Tap again to clear':'Clear these'}</a>
        </div>
        ${logged.map(t=>taskRow(t)).join('')}
      </div>
    `: ''}
  `;
}
function taskGroup(title, list){
  if(!list.length) return '';
  return `<div class="task-group">
    <div class="section-title">${title}</div>
    ${list.map(t=>taskRow(t)).join('')}
  </div>`;
}
function taskRow(t){
  const acc = t.accountId? getAccount(t.accountId): null;
  const overdue = !t.done && daysUntil(t.dueDate)<0;
  const meta = t.done
    ? `${acc? esc(acc.name)+' · ':''}Completed ${t.completedAt? niceDate(t.completedAt) : '— date not recorded'}`
    : `${acc? esc(acc.name)+' · ':''}${t.dueDate? niceDate(t.dueDate)+' · '+daysLabel(t.dueDate) : 'No due date'} · ${t.priority}`;
  const sfToggle = t.done ? `
    <label style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:5px;" onclick="event.stopPropagation();">
      <input type="checkbox" style="width:14px;height:14px;accent-color:var(--amber-deep);" ${t.loggedToSF?'checked':''} onchange="toggleLoggedSF('${t.id}')" />
      Logged to Salesforce
    </label>` : '';
  const snoozeRow = overdue ? `
    <div style="display:flex;gap:5px;margin-top:6px;" onclick="event.stopPropagation();">
      <button class="btn ghost small" onclick="snoozeTask('${t.id}',1)">Snooze 1 day</button>
      <button class="btn ghost small" onclick="snoozeTask('${t.id}',3)">3 days</button>
      <button class="btn ghost small" onclick="snoozeTask('${t.id}',7)">1 week</button>
    </div>` : '';
  return `<div class="task-row ${t.done?'done':''}">
    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')" />
    <div class="task-main" onclick="openTaskModal('${t.id}')">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta ${overdue?'overdue':''}">${meta}</div>
      ${sfToggle}
      ${snoozeRow}
    </div>
    <button class="btn ghost small" onclick="confirmDelete('task','${t.id}')">${state.ui.deleteConfirm && state.ui.deleteConfirm.id===t.id ? 'Confirm?':'✕'}</button>
  </div>`;
}
function snoozeTask(id, days){
  const t = state.data.tasks.find(x=>x.id===id);
  if(!t) return;
  t.dueDate = fmtDate(addDays(today(), days));
  save();
  render();
}
function toggleTask(id){
  const t = state.data.tasks.find(x=>x.id===id);
  t.done = !t.done;
  t.completedAt = t.done ? fmtDate(today()) : null;
  if(!t.done) t.loggedToSF = false;
  save(); render();
}
function toggleLoggedSF(id){
  const t = state.data.tasks.find(x=>x.id===id);
  t.loggedToSF = !t.loggedToSF;
  save(); render();
}

/* ================= DELETE CONFIRM (no native dialogs) ================= */
function confirmDelete(type,id){
  if(state.ui.deleteConfirm && state.ui.deleteConfirm.type===type && state.ui.deleteConfirm.id===id){
    if(type==='account'){
      state.data.accounts.forEach(a=>{ if(a.parentGroupId===id) a.parentGroupId=null; });
      state.data.accounts = state.data.accounts.filter(a=>a.id!==id);
    }
    if(type==='task') state.data.tasks = state.data.tasks.filter(t=>t.id!==id);
    if(type==='clearCompleted') state.data.tasks = state.data.tasks.filter(t=>!t.done);
    if(type==='csm'){
      state.data.csms = state.data.csms.filter(c=>c.id!==id);
      state.data.accounts.forEach(a=>{ if(a.csmId===id) a.csmId=null; });
      state.ui.modal = null;
    }
    if(type==='csmRequest'){ state.data.csmRequests = state.data.csmRequests.filter(r=>r.id!==id); state.ui.modal = null; }
    state.ui.deleteConfirm = null;
    save(); render();
  } else {
    state.ui.deleteConfirm = {type,id};
    if(type==='account') renderAccountsList(); else render();
    setTimeout(()=>{ if(state.ui.deleteConfirm && state.ui.deleteConfirm.id===id){ state.ui.deleteConfirm=null; if(type==='account') renderAccountsList(); else render(); } }, 3000);
  }
}

function toggleWorkDay(d){

function overridesListHTML(){
  const list = [...state.data.boyfriendSchedule.overrides].sort((a,b)=>a.date.localeCompare(b.date));

function addOverride(){
  const date = document.getElementById('ov_date').value;
  const type = document.getElementById('ov_type').value;
  const note = document.getElementById('ov_note').value.trim();
  if(!date) return;
  const existing = state.data.boyfriendSchedule.overrides.find(o=>o.date===date);
  if(existing){ existing.type=type; existing.note=note; }
  else state.data.boyfriendSchedule.overrides.push({ date, type, note });
  save();
  document.getElementById('overridesListEditor').innerHTML = overridesListHTML();
  renderTripNights();
}
function removeOverride(date){
  state.data.boyfriendSchedule.overrides = state.data.boyfriendSchedule.overrides.filter(o=>o.date!==date);

  document.getElementById('overridesListEditor').innerHTML = overridesListHTML();
  renderTripNights();

function collapsibleHeader(id, title, countLabel){
  return `<div class="section-title" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;" onclick="toggleSection('${id}')">
    <span>${title}${countLabel? ` <span style="color:var(--muted-2);font-weight:400;">(${countLabel})</span>`:''}</span>
    <span id="chevron-${id}" style="color:var(--muted-2);font-size:12px;">▸ tap to expand</span>
  </div>`;
}
function toggleSection(id){
  const el = document.getElementById('section-'+id);
  const chev = document.getElementById('chevron-'+id);
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  if(chev) chev.textContent = isHidden ? '▾ tap to collapse' : '▸ tap to expand';
}

      <button type="button" class="btn ghost small" onclick="removeEditingProduct(${i})">✕</button>

}

  document.getElementById('productsListEditor').innerHTML = productsListEditorHTML();
}
function saveAccountForm(id){
  const planning = {};
  DEPARTMENTS.forEach(dept=>{
    planning[dept] = {
      strengths: document.getElementById(`f_plan_${dept}_s`).value.trim(),
      weaknesses: document.getElementById(`f_plan_${dept}_w`).value.trim(),
    };
  });
  const vals = {
    name: document.getElementById('f_name').value.trim(),
    city: document.getElementById('f_city').value.trim(),
    state: document.getElementById('f_state').value,
    address: document.getElementById('f_address').value.trim(),
    csmId: document.getElementById('f_csm').value || null,
    parentGroupId: document.getElementById('f_parentGroup').value || null,
    status: document.getElementById('f_status').value,
    priority: document.getElementById('f_priority').value,
    renewalDate: document.getElementById('f_renewal').value || null,
    nextVisit: document.getElementById('f_next').value || null,
    notes: document.getElementById('f_notes').value.trim(),
    products: editingProducts,
    visitLog: editingVisits,
    marketing: editingMarketing,
    initiativesDiscussed: editingInitiatives,
    planning: planning,
  };
  if(!vals.name){ document.getElementById('f_name').style.borderColor = 'var(--red)'; return; }
  if(id==='new'){
    state.data.accounts.push({ id: uid(), ...vals });
  } else {
    Object.assign(getAccount(id), vals);
  }
  save();
  state.ui.modal = null;
  render();
}
function taskModal(){
  const isNew = state.ui.modal.id==='new';
  const t = isNew ? { title:'', accountId:'', dueDate: fmtDate(addDays(today(),1)), priority:'Medium', done:false } : state.data.tasks.find(x=>x.id===state.ui.modal.id);
  return `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-close"><button class="btn ghost small" onclick="closeModal()">Close ✕</button></div>
      <h2>${isNew?'Add task':'Edit task'}</h2>
      <div class="field"><label>Task</label><input id="t_title" value="${esc(t.title)}" data-autofocus /></div>
      <div class="field"><label>Related account (optional)</label>
        <select id="t_account"><option value="">— None —</option>${state.data.accounts.map(a=>`<option value="${a.id}" ${t.accountId===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
      </div>
      <div class="row2">
        <div class="field"><label>Due date</label><input type="date" id="t_due" value="${t.dueDate||''}" /></div>
        <div class="field"><label>Priority</label><select id="t_priority">${PRIORITIES.map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
      </div>
      <button class="btn primary fab-add" onclick="saveTaskForm('${isNew?'new':t.id}')">Save task</button>
    </div>
  </div>`;
}
function saveTaskForm(id){
  const vals = {
    title: document.getElementById('t_title').value.trim(),
    accountId: document.getElementById('t_account').value || null,
    dueDate: document.getElementById('t_due').value || null,
    priority: document.getElementById('t_priority').value,
  };
  if(!vals.title){ document.getElementById('t_title').style.borderColor='var(--red)'; return; }
  if(id==='new'){
    state.data.tasks.push({ id: uid(), done:false, loggedToSF:false, ...vals });
  } else {
    Object.assign(state.data.tasks.find(x=>x.id===id), vals);
  }
  save();
  state.ui.modal = null;
  render();
}

function esc(s){ const d=document.createElement('div'); d.textContent = s==null? '' : s; return d.innerHTML; }

load();
</script>
</body>
</html>
